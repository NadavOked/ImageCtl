<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig for the initramfs: one directory, one cache dir
     in tmpfs, and the generic families mapped onto IBM Plex so nothing
     ever resolves to a font that is not there. Point FONTCONFIG_FILE at
     this file; then /etc/fonts and /usr/share/fontconfig need not be
     packed at all. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/ibm-plex</dir>
  <cachedir>/run/fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>IBM Plex Sans Hebrew</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>IBM Plex Mono</family></prefer></alias>
</fontconfig>
