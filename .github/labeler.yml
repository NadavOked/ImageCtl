# תיוג אוטומטי לפי הקבצים ששונו. ‏PR שנוגע בשלושה אזורים מקבל שלוש
# תוויות, ומי שמסתכל על הלוח רואה מיד במה הוא נוגע בלי לפתוח אותו.
#
# אלה **תוויות רכיב** (`רכיב: ...`), ולא סוג או חומרה — אותן קובע אדם.

agent:
  - changed-files:
      - any-glob-to-any-file: ["agent/**"]

server:
  - changed-files:
      - any-glob-to-any-file: ["server/**"]

boot:
  - changed-files:
      - any-glob-to-any-file: ["boot/**"]

console:
  - changed-files:
      - any-glob-to-any-file: ["server/static/**", "server/console*.py"]

installer:
  - changed-files:
      - any-glob-to-any-file: ["install/**"]

lab:
  - changed-files:
      - any-glob-to-any-file: ["tools/lab/**"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]

documentation:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]
