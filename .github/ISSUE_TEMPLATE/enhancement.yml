name: "✨ יכולת"
description: "משהו חדש — מה, למה זה אות חזק, ומה אסור לעשות בדרך"
title: "✨ "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        אותו מבנה של טופס הבאג, כי הוא זה שעובד: מה · למה · מה היום לא רואה
        את זה · **מה שאסור** · הגדרת "גמור" · מה לא אומת.

        יכולת שמצדיקה קפיצת **minor** היא כזו שהמפעיל יכול להצביע עליה —
        מסך, כפתור, משהו שהוא רואה. כל השאר patch, כולל מודול פנימי בשרת
        וכלי מעבדה. הכלל המחייב ב-`CLAUDE.md`.

  - type: dropdown
    id: component
    attributes:
      label: רכיב
      description: איפה זה יישב. אפשר לסמן יותר מאחד.
      multiple: true
      options:
        - server
        - agent
        - boot
        - console
        - installer
        - tools
        - tests
        - docs
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: מה
      description: היכולת עצמה, במשפט או שניים.
      placeholder: |
        לדוגמה (מתוך #112): בדיקה חדשה במסך הבריאות — אילו מחשבים מגיעים
        לסוכן עכשיו, כשלא הייתה להם שום סיבה להגיע.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: למה זה שווה משהו
      description: |
        איזו שאלה אמיתית של המפעיל זה עונה. לא "יהיה נחמד" — **מי** נתקע
        היום בלי זה, ובמה.
      placeholder: |
        לדוגמה (מתוך #112): מכונה בלי משימה שבכל זאת הגיעה לסוכן — השרשור
        לדיסק המקומי נכשל. זה בדיוק התסמין "לתלמיד לא עולה הדיסק": המחשב
        מגיע, אין לו מענה, הוא נופל, ומגיע שוב — עד שמישהו מתקן אותו.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: מה היום קורה במקום
      description: |
        מה המערכת עושה כרגע, עם ציטוט קוד אם המידע כבר קיים ורק נזרק. אם
        שומר קיים אינו תופס את המקרה — להסביר למה.
      placeholder: |
        לדוגמה (מתוך #112): server/hello.py:28 מחשב off_deploy_vlan בכל
        hello ואפילו כותב שורת לוג, אבל לטבלת net_devices אין עמודה כזו.
        השרת יודע את זה לרגע, כותב לוג, ושוכח.
    validations:
      required: true

  - type: textarea
    id: decisions
    attributes:
      label: החלטות שננעלו
      description: |
        מה כבר הוכרע ואינו פתוח לדיון — ספים, מי נחשב, מה יורד מהמסך ומתי.
        **ומאיפה כל מספר נגזר**, כי מספר שהומצא יתגלה רק על חומרה.
      placeholder: |
        לדוגמה (מתוך #112): עשר הדקות נגזרו ולא הומצאו — המחזור שנמדד על
        הלנובו ב-#75 היה ~2 דקות, כלומר עשר דקות = חמישה מחזורים שלא הגיעו.
    validations:
      required: false

  - type: textarea
    id: forbidden
    attributes:
      label: מה שאסור
      description: |
        **הסעיף החשוב ביותר בטופס הזה.** אילו מימושים ייראו נכונים ויהיו
        שגויים — מסך שמתמלא ואיש לא קורא, היעדר אירוע שנספר כהצלחה, שינוי
        התנהגות אתחול בשביל תצוגה, ספרייה חדשה בלי סיבה. אם באמת אין כזה —
        לכתוב "אין" ולהסביר למה.
      placeholder: |
        לדוגמה (מתוך #112): לא להציג כל hello מחוץ לוילן ההפצה — תחנה
        בסבב פתוח היא התנהגות תקינה, ומסך שמתמלא בכל סבב גרוע מלא להציג
        כלום, כי הוא **נראה** כמו ניטור.
        ירידה מהרשימה אינה "נפתר": אין אירוע "נרפא", יש רק היעדר אירוע,
        ואסור לקפל אותו להצלחה (עיקרון 5).
        ולא לגעת בהתנהגות האתחול — זו תצוגה בלבד.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: הגדרת "גמור"
      description: |
        רשימה ממוספרת של מה שצריך להיות נכון, כולל **טסטים שנכשלים על הקוד
        שלפני השינוי**. גם המקרים השליליים — מה שאסור שיופיע.
      placeholder: |
        לדוגמה (מתוך #112):
        1. מכונה שנופלת לסוכן בלי משימה מופיעה במסך תוך מחזור אחד.
        2. שורה אחת למחשב, עם מונה שעולה.
        3. אחרי 10 דקות שתיקה — השורה נעלמת.
        4. תחנה בסבב פתוח אינה מופיעה כלל. יש טסט.
        7. טסטים שנכשלים על הקוד שלפני התיקון.
    validations:
      required: true

  - type: textarea
    id: unverified
    attributes:
      label: מאיפה זה בא, ומה לא אומת
      description: |
        מי ביקש ועל סמך מה, ואז **מה עדיין לא הוכח** — מה נמדד על חומרה
        אמיתית ומה נשען על הסימולציה או על הערכה בלבד.
      value: |
        **מקור:**

        **נמדד בפועל:**

        **לא אומת:**
    validations:
      required: true
