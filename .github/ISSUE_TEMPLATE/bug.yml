name: "\U0001F41B באג"
description: "משהו שבור — עם השורש, מה נשבר בפועל, ומה אסור לעשות בתיקון"
title: "\U0001F41B "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **חולשת אבטחה אינה Issue.** אם מצאת דבר שתוקף יכול לנצל, סגור את
        הטופס הזה ודווח דרך
        [Security Advisories](https://github.com/NadavOked/ImageCtl/security/advisories/new).
        הריפו ציבורי — Issue מפרסם את החולשה לפני שיש תיקון. הפרטים
        ב-`SECURITY.md`.

        המבנה שלמטה אינו טופס בירוקרטי. הוא מה שהפריד כאן, שוב ושוב, בין
        באג שתוקן לבין באג שהחליף צורה — ובמיוחד הסעיף **"מה שאסור"**.

  - type: dropdown
    id: component
    attributes:
      label: רכיב
      description: איפה זה יושב. אפשר לסמן יותר מאחד.
      multiple: true
      options:
        - server
        - agent
        - boot
        - console
        - installer
        - tools
        - tests
        - docs
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: תיאור
      description: מה קורה, במשפט או שניים, לפני הראיות.
      placeholder: |
        לדוגמה (מתוך #84): ה-initramfs אינו יכול לעגון אף מערכת קבצים מלבד
        NTFS דרך FUSE. תיקיית kernel/fs אינה נארזת כלל. זה שובר שלושה
        דברים שונים, ואחד מהם הוא הסיבה ל-#62.
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: השורש — עם ציטוט קוד
      description: |
        הקובץ והשורה, והקוד עצמו. לא "יש בעיה ב-archive.py" אלא **השורה
        שגורמת לה**. אם השורש עדיין לא הוכרע — לכתוב זאת במפורש, ולא
        לנחש. "לא הצלחנו לבדוק" ו"בדקנו" הם שני מצבים שונים (עיקרון 5).
      value: |
        ```py
        # server/<קובץ>.py:<שורה>
        ```

    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: מה נשבר בפועל
      description: |
        מה מפסיק לעבוד אצל המפעיל או התלמיד, ובאילו תנאים. אם הכשל
        **שקט** — לומר זאת: זו בדרך כלל החומרה האמיתית.
      placeholder: |
        לדוגמה (מתוך #98): שם קבוצה "Lab A" מוליד קידומת LAB_A, וקו תחתון
        אינו תו חוקי בשם מחשב. כל 30 המחשבים עולים עם השם שהיה באימג' —
        כלומר כולם עם אותו שם — והקונסולה מציגה "done".
    validations:
      required: true

  - type: textarea
    id: forbidden
    attributes:
      label: מה שאסור
      description: |
        **הסעיף החשוב ביותר בטופס הזה.** אילו תיקונים ייראו נכונים ויהיו
        שגויים — הפחתת רעש שמסתירה את הכשל, `|| true`, `2>/dev/null`,
        ‏`skipif`, ניקוי קלט בשקט, או תיקון שמייצר את הבאג ההפוך. אם באמת
        אין כזה — לכתוב "אין" ולהסביר למה.
      placeholder: |
        לדוגמה (מתוך #110): לא לנקות את המזהה בשקט (strip, basename, החלפת
        תווים). מניפסט עם מזהה לא חוקי הוא מניפסט לא תקין — נדחה בשמו.
        ניקוי שקט הופך קלט זדוני לקלט תקין.

        לדוגמה (מתוך #113): לא לתקן את הטסט כך שיעקוף את הבעיה (לדלג כשאין
        eth1). זה בדיוק ה-skip השקט ש-#52 סגר.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: הגדרת "גמור"
      description: |
        מה צריך להיות נכון כדי לסגור. **ראיה חיובית** — טסט שנכשל על הקוד
        שלפני התיקון, קוד תשובה, ערך שנקרא בחזרה. לא "נראה שזה עובד".
      placeholder: |
        לדוגמה (מתוך #110): ארכיון עם מזהה שאינו תואם את הפורמט נדחה, עם
        הודעה שאומרת למה. יש טסט שמנסה `../` בשני השדות ומוודא ששום דבר לא
        נכתב ולא נקרא מחוץ לשורש.
    validations:
      required: true

  - type: textarea
    id: unverified
    attributes:
      label: איך זה נמצא, ומה לא אומת
      description: |
        איפה זה נצפה (מעבדת VM / מחשב ברזל / CI / תחנת הפיתוח / סקירה
        סטטית), ובאיזה תג או קומיט. ואז — **מה עדיין לא הוכח**: מה שוחזר
        בפועל ומה הוסק. סביבה אחת ירוקה אינה ראיה שהקוד ירוק; ככה #113
        החזיק CI אדום 12 קומיטים.
      value: |
        **נמצא:**

        **תג/קומיט:**

        **שוחזר בפועל:**

        **לא אומת:**
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: לפני הפתיחה
      options:
        - label: אימתתי את השורש **מול הקוד או מול הרצה**, ולא מהזיכרון
          required: true
        - label: זו אינה חולשת אבטחה (אחרת — Security Advisory, לא Issue)
          required: true
