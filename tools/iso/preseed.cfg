#_preseed_V1
# ImageCtl — preseed של debian-installer ל-ISO ההתקנה (#1139; R25 §2.3, R58).
#
# מה הקובץ הזה מכריע, במילים:
#   * ההתקנה **offline**: אין mirror ואין עדכוני אבטחה מהרשת. החבילות
#     מגיעות מה-ISO עצמו דרך המנגנון שכל התקנה מ-CD משתמשת בו
#     (‏apt-setup/cdrom → apt-cdrom, ‏APT::Authentication::TrustCDROM):
#     ה-netinst הוא repo של apt, ‏build-iso.sh מוסיף לו את pool/ שלנו
#     ומאנדקס מחדש את dists/ (make-pool.sh --index-only). ‏Release של
#     ה-netinst הרשמי עצמו אינו חתום — זה המסלול הרשמי, בלי
#     ‏allow_unauthenticated ובלי מפתח ארעי.
#   * **הדיסק הראשון שאינו USB נמחק, בלי שאלה.** זה ISO של התקנת שרת,
#     וזה מה שהוא עושה. תפריט האתחול **ממתין לאדם** — אין timeout
#     שמתחיל מחיקה לבד (עיקרון 7 ברוח).
#   * ‏root בלבד. הגיבוב נקבע **בזמן הבנייה** (build-iso.sh
#     ‏--root-password / IMAGECTL_ROOT_PASSWORD) — לא ב-git — ומוחלף
#     בכניסה הראשונה (chage -d 0). **אין sshd על השרת** (הכרעת נדב 19/09:
#     ‏SSH הוא כלי מעבדה, לא מוצר) — הכניסה היא במסך.
#   * ‏late_command כותב ל-/target/etc/imagectl **עובדות שנמדדו בהתקנה**
#     ולא ניחושים (R62): הכרטיס ש-d-i עצמו הגדיר (‏installer-nic: שם +
#     ‏MAC + reason), התפקיד מתפריט האתחול (‏installer-role, R60), ומניפסט
#     ה-ISO (‏iso-release.json, R61). ‏firstboot.sh קורא אותן.
#
# ‏@PKGSEL_INCLUDE@ ו-@ROOT_PASSWORD_HASH@ מוחלפים על ידי build-iso.sh.
# הרשימה היא packages.txt — רשימה אחת, לא שתיים שנסחפות (הלקח של R25).

# --- שפה ומקלדת -------------------------------------------------------------
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8, he_IL.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# --- רשת בזמן ההתקנה ----------------------------------------------------------
# ‏DHCP על הכרטיס הראשון עם link; בלי DHCP ממשיכים בלי רשת (ההתקנה אינה
# צריכה אותה) — ואז installer-nic נכתב בלי כרטיס, ו-firstboot משאיר את
# ההכרעה לאשף (#910).
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 20
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Do not configure the network at this time
d-i netcfg/get_hostname string imagectl-server
d-i netcfg/get_domain string
d-i netcfg/hostname string imagectl-server
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

# --- אין mirror: החבילות מה-ISO בלבד -----------------------------------------
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
# שתי שאלות שעצרו התקנה ב-QEMU (19/09) גם ב-priority=critical: ‏41cdset
# מוצא את אותו דיסק שוב ("already been scanned"), ו-50mirror מזהיר
# ש-netinst בלי mirror הוא "מערכת מינימלית" — אצלנו ה-ISO הוא ה-mirror.
d-i apt-setup/cdrom/set-double boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/security_host string
d-i apt-setup/enable-source-repositories boolean false
# אחרי ההתקנה שורת ה-cdrom ב-sources.list מושבתת: `apt-get update` של
# setup-boot-server.sh לא ימתין לדיסק שאינו שם. להתקנה נוספת מה-ISO:
# לחבר אותו ולהריץ `apt-cdrom add`.
d-i apt-setup/disable-cdrom-entries boolean true

# --- שעון (offline: בלי NTP בזמן ההתקנה) --------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Jerusalem
d-i clock-setup/ntp boolean false

# --- דיסק: הראשון שאינו USB, כולו, מחיצה אחת (R58) ----------------------------
# ‏`partman-auto/disk` ריק **עוצר ושואל** על יותר מדיסק אחד (bug #990161).
# ‏early_command בוחר את הדיסק הראשון ש-udev אינו מסמן כ-USB — כך
# הדיסק-און-קי שממנו מתקינים אינו היעד.
d-i partman/early_command string \
    DISK=$(list-devices disk | head -n1); \
    for d in $(list-devices disk); do \
        if ! udevadm info --query=property --name=$d | grep -q ID_BUS=usb; then \
            DISK=$d; break; \
        fi; \
    done; \
    debconf-set partman-auto/disk $DISK
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-efi/non_efi_system boolean true

# --- משתמשים: root בלבד --------------------------------------------------------
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password-crypted password @ROOT_PASSWORD_HASH@

# --- חבילות ------------------------------------------------------------------
tasksel tasksel/first multiselect standard
d-i pkgsel/include string @PKGSEL_INCLUDE@
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# --- GRUB: UEFI + BIOS מאותו preseed ----------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

# --- סיום: הקוד, העובדות שנמדדו, ויחידת האתחול הראשון ------------------------
# רץ בסביבת d-i: ‏/cdrom הוא ה-ISO, ‏/target היא המערכת המותקנת.
# ‏cp -a שומר הרשאות (Rock Ridge). הסקריפט עצמו על ה-ISO — כדי שהלוגיקה
# לא תחיה בשורה אחת של preseed.
d-i preseed/late_command string \
    sh /cdrom/imagectl/late-command.sh

d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
