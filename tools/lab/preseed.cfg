# התקנה אוטומטית של שרת המעבדה (Issue #12) — Debian 13 על Hyper-V.
# נטען מהמתקין דרך שורת האתחול (ראו tools/lab/README.md); פרטי הרשת
# מגיעים משורת האתחול כי הם נדרשים עוד לפני שהקובץ הזה נמשך.
#
# הסיסמאות כאן הן של מעבדת VM מבודדת בלבד (סוויץ' פנימי, מאחורי NAT,
# לא נגיש מבחוץ) — לא של שום סביבה אמיתית.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/get_hostname string imagectl
d-i netcfg/get_domain string lab

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# הדיסק של ההתקנה לא נכנס למקורות apt — הכול מהרשת.
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

d-i passwd/root-login boolean true
d-i passwd/root-password password 1234
d-i passwd/root-password-again password 1234
d-i user-setup/allow-password-weak boolean true
d-i passwd/user-fullname string test
d-i passwd/username string test
d-i passwd/user-password password 1234
d-i passwd/user-password-again password 1234

d-i clock-setup/utc boolean true
d-i time/zone string Asia/Jerusalem

# כל הדיסק, מחיצה אחת; שרידי התקנה קודמת נמחקים בלי לשאול.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect ssh-server, standard
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# מפתח הכניסה של מכונת הפיתוח — ההתקנה ממשיכה משם ב-SSH, בלי סיסמה.
d-i preseed/late_command string in-target mkdir -p /root/.ssh; \
    echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXAMPLEKEYEXAMPLEKEYEXAMPLEKEYEXAMPLEKEY imagectl-lab' > /target/root/.ssh/authorized_keys; \
    in-target chmod 700 /root/.ssh; in-target chmod 600 /root/.ssh/authorized_keys

# בסיום — כיבוי, לא ריסטארט: כך המארח יודע שההתקנה נגמרה, מנתק את
# ה-ISO ומדליק מחדש לדיסק.
d-i debian-installer/exit/poweroff boolean true
