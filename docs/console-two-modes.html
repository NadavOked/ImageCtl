<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שרת אימג'ים — שני מצבים</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --porcelain:#EEF1F4; --surface:#FFFFFF; --ink:#15202B; --muted:#6B7B8A;
  --hair:#DCE2E8; --indigo:#2B3FA0; --indigo-soft:#EAECF8;
  --led-write:#E39A2B; --led-ok:#2E9E6B; --led-idle:#B7C1CA; --danger:#C0453B;
  --r:14px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans Hebrew",system-ui,sans-serif;background:var(--porcelain);
  color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.mono{font-family:"IBM Plex Mono",monospace;font-feature-settings:"tnum";direction:ltr;display:inline-block}

/* mode switch */
.switch{background:#0F1720;padding:9px 16px;display:flex;align-items:center;gap:10px;flex:none}
.switch span{font-size:11.5px;color:#7A8898;margin-inline-end:4px}
.switch button{font-family:inherit;font-size:12px;background:rgba(255,255,255,.07);color:#9BA9B8;
  border:1px solid rgba(255,255,255,.11);padding:6px 14px;border-radius:20px;cursor:pointer}
.switch button:hover{background:rgba(255,255,255,.13);color:#E8EDF2}
.switch button.on{background:#E8EDF2;color:#15202B;border-color:#E8EDF2;font-weight:500}
.switch .note{margin-inline-start:auto;font-size:11.5px;color:#7A8898}

header{background:var(--surface);border-bottom:1px solid var(--hair);padding:0 20px;
  display:flex;align-items:center;gap:18px;height:62px;flex:none}
.hbrand{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid var(--hair);height:100%}
.mark{width:28px;height:28px;border-radius:8px;background:var(--ink);position:relative;flex:none}
.mark::before{content:"";position:absolute;left:6px;right:6px;top:9px;height:2.5px;border-radius:2px;background:#5C6C7C}
.mark::after{content:"";position:absolute;right:6px;top:16px;width:8px;height:2.5px;border-radius:2px;background:var(--led-write)}
.hbrand strong{font-size:14px;font-weight:600;display:block;line-height:1.25}
.hbrand em{font-size:11px;color:var(--muted);font-style:normal}
.actions{display:flex;gap:8px}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo);
  display:grid;place-items:center;font-weight:600;font-size:12px}
.role{font-size:10.5px;background:var(--indigo-soft);color:var(--indigo);padding:3px 9px;border-radius:20px;font-weight:600}

main{flex:1;display:grid;grid-template-columns:268px 1fr 246px;gap:14px;padding:14px;min-height:0}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);overflow:auto;min-height:0}
.ptitle{font-size:11px;font-weight:600;letter-spacing:.7px;color:var(--muted);padding:14px 16px 10px;text-transform:uppercase}

.btn{font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid var(--hair);
  background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:var(--r-sm);transition:.14s;
  display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#F5F7F9;border-color:#C8D2DA}
.btn:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.btn.warn{color:var(--danger);border-color:#EBD3D1}
.btn.warn:hover{background:#FCF4F3;border-color:var(--danger)}

/* metrics */
.metric{padding:0 16px 16px}
.metric .big{font-size:30px;font-weight:600;letter-spacing:-1px;line-height:1}
.metric .big span{font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}
.metric .sub{font-size:12px;color:var(--muted);margin-top:5px}
.blocks{display:flex;gap:2px;margin-top:13px;height:26px}
.blocks i{flex:1;border-radius:2px;background:#E4E9ED}
.blocks i.on{background:var(--ink)}
.blocks i.warn{background:var(--led-write)}
.divide{height:1px;background:var(--hair);margin:2px 16px}
.stat{display:flex;justify-content:space-between;padding:7px 16px;font-size:12.5px}
.stat span{color:var(--muted)}

.bay{margin:0 16px 16px;border:1px solid var(--hair);border-radius:var(--r-sm);overflow:hidden}
.bay .slot{background:#F7F9FA;padding:13px;display:flex;align-items:center;gap:11px}
.slot .tray{width:46px;height:30px;border-radius:4px;background:var(--ink);flex:none;position:relative}
.slot .tray::after{content:"";position:absolute;bottom:5px;left:6px;width:5px;height:5px;border-radius:50%;
  background:var(--led-ok);box-shadow:0 0 7px var(--led-ok)}
.slot .tray.empty{background:#DDE3E8}
.slot .tray.empty::after{background:var(--led-idle);box-shadow:none}
.slot b{font-size:12.5px;font-weight:600;display:block}
.slot small{font-size:11.5px;color:var(--muted)}
.bay .act{padding:10px 13px;border-top:1px solid var(--hair);background:var(--surface)}
.bay .act .btn{width:100%;justify-content:center;font-size:12.5px}

/* live session card — server mode only */
.live{margin:0 16px 16px;border:1px solid #E4D4B8;border-radius:var(--r-sm);background:#FDF8EF;padding:13px}
.live .top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--led-write);flex:none;
  box-shadow:0 0 0 4px rgba(227,154,43,.18)}
.live b{font-size:12.5px;font-weight:600}
.live .bar{height:6px;border-radius:4px;background:#EFE3CE;overflow:hidden;margin-bottom:8px}
.live .bar i{display:block;height:100%;width:62%;background:var(--led-write);border-radius:4px}
.live small{font-size:11.5px;color:#8A7550;display:block}
.live .ro{font-size:10.5px;color:#A08A62;margin-top:9px;padding-top:9px;border-top:1px solid #EFE3CE}

/* tree */
.tree{padding:0 8px 12px}
.node{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;user-select:none}
.node:hover{background:#F3F6F8}
.node.sel{background:var(--indigo-soft);color:var(--indigo);font-weight:600}
.node .caret{width:9px;color:var(--muted);font-size:9px;flex:none}
.node.open .caret{transform:rotate(-90deg)}
.node .cnt{margin-inline-start:auto;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.kids{padding-inline-start:20px;display:none}
.kids.show{display:block}
.kids .node{font-size:13px;padding:6.5px 10px}

/* content */
.chead{padding:16px 20px 12px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--hair)}
.chead h2{font-size:19px;font-weight:600;letter-spacing:-.4px}
.chead p{font-size:12.5px;color:var(--muted);margin-top:3px}
.chead .btn{margin-inline-start:auto}
.rows{padding:8px}
.row{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:14px;
  padding:13px 12px;border-radius:10px;cursor:pointer}
.row:hover{background:#F3F6F8}
.row.sel{background:var(--indigo-soft)}
.chip{width:38px;height:38px;border-radius:9px;background:var(--ink);flex:none;position:relative}
.chip::after{content:"";position:absolute;bottom:6px;left:6px;width:4px;height:4px;border-radius:50%;
  background:var(--led-ok);box-shadow:0 0 6px var(--led-ok)}
.row b{font-size:14px;font-weight:600;display:block}
.row small{font-size:12px;color:var(--muted)}
.size{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted)}
.date{font-size:12px;color:var(--muted);width:70px;text-align:left}
.tag{font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:600;background:#E7EDF2;color:#5A6E80}
.tag.legacy{background:#FBF0E4;color:#9A6E2A}
.detail{border-top:1px solid var(--hair);padding:16px 20px;background:#FAFBFC}
.detail h3{font-size:15px;font-weight:600;margin-bottom:3px}
.detail .desc{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:14px}
.meta{display:flex;gap:26px;margin-bottom:15px;flex-wrap:wrap}
.meta div small{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.meta div b{font-size:13px;font-weight:500;font-family:"IBM Plex Mono",monospace}
.dbtns{display:flex;gap:7px;flex-wrap:wrap}

@media(max-width:1000px){main{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}.actions{overflow:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="switch">
  <span>מצב תצוגה</span>
  <button id="b-srv" class="on" onclick="setMode('srv')">קונסולת השרת</button>
  <button id="b-bld" onclick="setMode('bld')">מחשב הבנייה — חדר שיכפולים</button>
  <span class="note" id="note"></span>
</div>

<header>
  <div class="hbrand"><div class="mark"></div>
    <div><strong>שרת אימג'ים</strong><em id="ctx"></em></div></div>
  <div class="actions" id="actions"></div>
  <div class="who"><span class="role" id="role"></span><span>נדב</span><div class="avatar">נ</div></div>
</header>

<main>
  <section class="panel" id="rail"></section>
  <section class="panel">
    <div class="chead">
      <div><h2 id="fname">סייבר</h2><p id="fdesc">מעבדות אבטחת מידע — סמסטר ב'</p></div>
      <button class="btn" id="fbtn">עריכת תיקייה</button>
    </div>
    <div class="rows" id="rows"></div>
    <div id="detail"></div>
  </section>
  <section class="panel"><div class="ptitle">תיקיות</div><div class="tree" id="tree"></div></section>
</main>

<script>
const data = {
  "סייבר":{desc:"מעבדות אבטחת מידע — סמסטר ב'",imgs:[
    {n:"Kali + Wireshark",d:"קורס ניתוח תעבורה. Wireshark, nmap, Burp.",s:"48.2 GB",t:"12.08.26",g:"UEFI"},
    {n:"Windows Server — AD Lab",d:"שרת דומיין להדגמות הרשאות ו‑GPO.",s:"61.7 GB",t:"04.08.26",g:"UEFI"},
    {n:"Metasploitable",d:"מכונת מטרה לתרגילי חדירה.",s:"22.9 GB",t:"29.07.26",g:"Legacy"}]},
  "רשתות":{desc:"קורסי תשתית ותקשורת",imgs:[
    {n:"GNS3 + Packet Tracer",d:"סימולציית ציוד תקשורת.",s:"54.1 GB",t:"18.08.26",g:"UEFI"},
    {n:"Linux — Networking",d:"Debian 13 עם כלי ניתוח רשת.",s:"31.4 GB",t:"11.08.26",g:"UEFI"}]},
  "אופיס":{desc:"תחנות הוראה כלליות",imgs:[
    {n:"Office 2024 — סטנדרט",d:"האימג' הנפוץ ביותר. 14 כיתות.",s:"58.8 GB",t:"22.08.26",g:"UEFI"},
    {n:"Office + Adobe",d:"כיתות עיצוב בלבד.",s:"77.3 GB",t:"22.08.26",g:"UEFI"}]},
  "וירטואליזציה":{desc:"קורסי VMware ו‑Proxmox",imgs:[
    {n:"VMware Workstation",d:"היפרוויזר עם 3 מכונות מוכנות.",s:"92.5 GB",t:"09.08.26",g:"UEFI"}]},
  "ארכיון":{desc:"גרסאות קודמות — לא בשימוש פעיל",imgs:[]}
};

const MODES = {
  srv:{ctx:"קונסולת ניהול · חדר שרתים", role:"אדמין",
    note:"ניהול הספרייה, משתמשים וטבלאות MAC. אין פעולות הפצה.",
    actions:[["הגדרות",""],["משתמשים",""],["טבלאות MAC",""],["יומן פעולות",""]],
    folderBtn:"עריכת תיקייה",
    imgBtns:[["שינוי שם",""],["עריכת תיאור",""],["העברה לתיקייה אחרת",""],["מחיקה","warn"]]},
  bld:{ctx:"מחשב הבנייה · חדר שיכפולים", role:"אדמין",
    note:"עולה ב‑PXE. קליטת אימג' והפצה ל‑12 מחשבי השיכפול.",
    actions:[["קליטת אימג'",""],["הפצה למחשבי שיכפול",""],["ניתוק כונן",""]],
    folderBtn:"",
    imgBtns:[["הפצה למחשבי שיכפול",""]]}
};

let mode="srv", cur="סייבר", sel=null;

function blocks(){return Array.from({length:32},(_,i)=>`<i class="${i<13?(i>10?'warn':'on'):''}"></i>`).join("")}

function drawRail(){
  const storage=`
    <div class="ptitle">אחסון</div>
    <div class="metric"><div class="big">2.4<span> TB פנוי מתוך 4</span></div>
      <div class="sub">‎14 אימג'ים ב‑5 תיקיות</div>
      <div class="blocks">${blocks()}</div></div>`;

  const srvExtra=`
    <div class="divide"></div>
    <div class="ptitle">סבב פעיל</div>
    <div class="live">
      <div class="top"><div class="dot"></div><b>כיתה LAB1 · Office 2024</b></div>
      <div class="bar"><i></i></div>
      <small>‎18 מתוך 29 הושלמו · נותרו כ‑3:10</small>
      <div class="ro">תצוגה בלבד — הסבב נפתח מהכיתה</div>
    </div>
    <div class="divide"></div>
    <div class="ptitle">מצב</div>
    <div class="stat"><span>משתמשים מוגדרים</span><b class="mono">4</b></div>
    <div class="stat"><span>מחשבים בטבלאות</span><b class="mono">612</b></div>
    <div class="stat"><span>MAC לא מוכר</span><b class="mono" style="color:var(--led-write)">2</b></div>
    <div style="height:12px"></div>`;

  const bldExtra=`
    <div class="divide"></div>
    <div class="ptitle">מגירה במחשב</div>
    <div class="bay">
      <div class="slot"><div class="tray"></div>
        <div><b>מחובר — <span class="mono">sdb</span></b><small>Samsung 870 · 500GB · GPT</small></div></div>
      <div class="act"><button class="btn">ניתוק בטוח</button></div>
    </div>
    <div class="divide"></div>
    <div class="ptitle">מחשבי שיכפול</div>
    <div class="stat"><span>דולקים</span><b class="mono">7 / 12</b></div>
    <div class="stat"><span>כוננים מוכנים</span><b class="mono">19</b></div>
    <div class="stat"><span>הפצה אחרונה</span><b>אתמול</b></div>
    <div style="height:12px"></div>`;

  document.getElementById("rail").innerHTML = storage + (mode==="srv"?srvExtra:bldExtra);
}

function drawTree(){
  document.getElementById("tree").innerHTML = Object.keys(data).map(k=>{
    const o=data[k], on=k===cur;
    return `<div class="node ${on?'sel open':''}" onclick="pick('${k}')">
      <span class="caret">▾</span><span>${k}</span><span class="cnt">${o.imgs.length}</span></div>
      <div class="kids ${on?'show':''}">${o.imgs.map((m,i)=>
        `<div class="node ${sel===i&&on?'sel':''}" onclick="event.stopPropagation();pickImg('${k}',${i})">
          <span style="width:9px"></span><span>${m.n}</span></div>`).join("")||
        `<div class="node" style="color:#9AA7B2;cursor:default">ריק</div>`}</div>`;
  }).join("");
}

function drawRows(){
  const o=data[cur], M=MODES[mode];
  document.getElementById("fname").textContent=cur;
  document.getElementById("fdesc").textContent=o.desc;
  const fb=document.getElementById("fbtn");
  fb.style.display = M.folderBtn ? "" : "none";
  fb.textContent = M.folderBtn;

  document.getElementById("rows").innerHTML = o.imgs.length ? o.imgs.map((m,i)=>
    `<div class="row ${sel===i?'sel':''}" onclick="pickImg('${cur}',${i})">
      <div class="chip"></div>
      <div><b>${m.n}</b><small>${m.d}</small></div>
      <span class="tag ${m.g==='Legacy'?'legacy':''}">${m.g}</span>
      <div class="size">${m.s}</div><div class="date">${m.t}</div></div>`).join("")
    : `<div style="padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px">
        אין אימג'ים בתיקייה הזו.</div>`;

  const d=document.getElementById("detail");
  if(sel===null||!o.imgs[sel]){d.innerHTML="";return}
  const m=o.imgs[sel];
  d.innerHTML=`<div class="detail">
    <h3>${m.n}</h3><p class="desc">${m.d}</p>
    <div class="meta">
      <div><small>גודל</small><b>${m.s}</b></div>
      <div><small>תאריך העלאה</small><b>${m.t}</b></div>
      <div><small>סוג אתחול</small><b>${m.g}</b></div>
      <div><small>תיקייה</small><b style="font-family:inherit">${cur}</b></div>
    </div>
    <div class="dbtns">${M.imgBtns.map(([t,c])=>`<button class="btn ${c}">${t}</button>`).join("")}</div>
  </div>`;
}

function setMode(m){
  mode=m;
  const M=MODES[m];
  document.getElementById("b-srv").classList.toggle("on",m==="srv");
  document.getElementById("b-bld").classList.toggle("on",m==="bld");
  document.getElementById("ctx").textContent=M.ctx;
  document.getElementById("role").textContent=M.role;
  document.getElementById("note").textContent=M.note;
  document.getElementById("actions").innerHTML=M.actions.map(([t,c])=>`<button class="btn ${c}">${t}</button>`).join("");
  drawRail();drawRows();
}
function pick(k){cur=k;sel=null;drawTree();drawRows()}
function pickImg(k,i){cur=k;sel=i;drawTree();drawRows()}

setMode("srv");drawTree();
</script>
</body>
</html>
