<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסך שחזור — תחנה</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15202B; --deep:#111A24; --surface:#FFFFFF;
  --muted:#8A98A5; --hair:#2A3846; --hair-l:#DCE2E8;
  --indigo:#5B72E8; --indigo-soft:#EAECF8;
  --led-write:#E39A2B; --led-ok:#2E9E6B; --led-idle:#4A5A6A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"IBM Plex Sans Hebrew",system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 70% -15%,#22303F 0%,transparent 62%),
             linear-gradient(165deg,#16212C 0%,#0D141C 100%);
  color:#E8EDF2;display:grid;place-items:center;font-size:15px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",monospace;direction:ltr;display:inline-block;font-feature-settings:"tnum"}

.stage{width:min(620px,92vw)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.mark{width:38px;height:38px;border-radius:11px;background:#0B1219;flex:none;position:relative;
  box-shadow:inset 0 0 0 1px #2C3B4A}
.mark::before{content:"";position:absolute;left:9px;right:9px;top:12px;height:3px;border-radius:2px;background:#43566A}
.mark::after{content:"";position:absolute;right:9px;top:21px;width:10px;height:3px;border-radius:2px;
  background:var(--led-ok);box-shadow:0 0 9px var(--led-ok)}
.brand h1{font-size:17px;font-weight:600;letter-spacing:-.2px}
.brand p{font-size:12px;color:var(--muted);margin-top:2px}
.brand .host{margin-inline-start:auto;text-align:left;font-size:11.5px;color:var(--muted);line-height:1.7}

.card{background:var(--surface);color:var(--ink);border-radius:20px;overflow:hidden;
  box-shadow:0 40px 90px -28px rgba(0,0,0,.7)}
.chead{padding:24px 28px 18px;border-bottom:1px solid var(--hair-l)}
.chead h2{font-size:21px;font-weight:600;letter-spacing:-.4px}
.chead p{font-size:13px;color:#6B7B8A;margin-top:4px}
.steps{display:flex;gap:5px;padding:16px 28px 0}
.steps i{height:3px;flex:1;border-radius:2px;background:#E4E9ED;transition:.3s}
.steps i.on{background:var(--ink)}
.body{padding:26px 28px}
.foot{padding:16px 28px;border-top:1px solid var(--hair-l);background:#FAFBFC;display:flex;gap:9px;align-items:center}

label{display:block;font-size:12.5px;color:#6B7B8A;margin-bottom:7px;font-weight:500}
input{width:100%;padding:13px 15px;border:1px solid var(--hair-l);border-radius:10px;
  font-family:inherit;font-size:15px;background:#FBFCFD;color:var(--ink)}
input:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:transparent}
.btn{font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--hair-l);
  background:#fff;color:var(--ink);padding:11px 20px;border-radius:10px;transition:.14s}
.btn:hover{background:#F3F6F8;border-color:#C8D2DA}
.btn:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#22303F}
.btn.ghost{margin-inline-start:auto;border-color:transparent;background:transparent;color:#6B7B8A}

/* mode choice */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:1.5px solid var(--hair-l);border-radius:14px;padding:20px;cursor:pointer;transition:.14s;text-align:right}
.mode:hover{border-color:#B8C4CE;background:#FAFBFC}
.mode.on{border-color:var(--ink);background:#F7F9FA}
.mode .icons{display:flex;gap:4px;margin-bottom:13px}
.mode .icons i{width:15px;height:21px;border-radius:3px;background:#D7DEE4;position:relative}
.mode .icons i.lit{background:var(--ink)}
.mode .icons i.lit::after{content:"";position:absolute;bottom:3px;left:3px;width:3px;height:3px;
  border-radius:50%;background:var(--led-ok)}
.mode b{font-size:15px;font-weight:600;display:block;margin-bottom:4px}
.mode small{font-size:12.5px;color:#6B7B8A;line-height:1.5;display:block}

/* session banner */
.session{background:var(--indigo-soft);border-radius:12px;padding:14px 16px;margin-bottom:20px;
  display:flex;align-items:center;gap:12px}
.session .dot{width:8px;height:8px;border-radius:50%;background:var(--led-write);flex:none;
  box-shadow:0 0 0 4px rgba(227,154,43,.18)}
.session b{font-size:13.5px;font-weight:600;color:#2B3FA0;display:block}
.session small{font-size:12px;color:#5566B8}

/* image picker */
.group{margin-bottom:18px}
.glabel{font-size:11px;font-weight:600;letter-spacing:.7px;color:#8A98A5;margin-bottom:8px;text-transform:uppercase}
.img{display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:11px;cursor:pointer;
  border:1.5px solid transparent}
.img:hover{background:#F3F6F8}
.img.on{border-color:var(--ink);background:#F7F9FA}
.chip{width:36px;height:36px;border-radius:9px;background:var(--ink);flex:none;position:relative}
.chip::after{content:"";position:absolute;bottom:6px;left:6px;width:4px;height:4px;border-radius:50%;
  background:var(--led-ok);box-shadow:0 0 6px var(--led-ok)}
.img b{font-size:14px;font-weight:600;display:block}
.img small{font-size:12px;color:#6B7B8A}
.img .sz{margin-inline-start:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:#8A98A5}

.namewrap{border-top:1px solid var(--hair-l);margin-top:20px;padding-top:20px}
.hint{font-size:12px;color:#8A98A5;margin-top:8px;line-height:1.55}

/* machine picker */
.machgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.mach{border:1.5px solid var(--hair-l);border-radius:9px;padding:9px 0;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:13px;cursor:pointer;color:#8A98A5;
  transition:.12s;user-select:none}
.mach:hover{border-color:#B8C4CE}
.mach.on{border-color:var(--ink);background:#F7F9FA;color:var(--ink);font-weight:600}

/* progress */
.prog{text-align:center;padding:8px 0 4px}
.prog .pct{font-size:44px;font-weight:600;letter-spacing:-2px;font-family:"IBM Plex Mono",monospace}
.prog .lbl{font-size:13px;color:#6B7B8A;margin-top:2px}
.bar{height:8px;border-radius:5px;background:#E4E9ED;overflow:hidden;margin:22px 0 14px}
.bar i{display:block;height:100%;width:38%;background:var(--led-write);border-radius:5px;
  animation:grow 4s ease-in-out infinite alternate}
@keyframes grow{from{width:34%}to{width:47%}}
.pstats{display:flex;justify-content:space-between;font-size:12.5px;color:#6B7B8A}
.pstats b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-weight:500}
.peers{margin-top:22px;border-top:1px solid var(--hair-l);padding-top:18px}
.peers .glabel{margin-bottom:11px}
.peer{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.peer .led{width:7px;height:7px;border-radius:50%;background:var(--led-write);flex:none;
  box-shadow:0 0 6px var(--led-write)}
.peer .led.done{background:var(--led-ok);box-shadow:0 0 6px var(--led-ok)}
.peer .pc{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.peer .st{margin-inline-start:auto;font-size:12px;color:#8A98A5}

.done .icon{width:56px;height:56px;border-radius:16px;background:#E8F5EE;display:grid;place-items:center;
  margin:0 auto 18px}
.done .icon::after{content:"";width:20px;height:11px;border-left:3px solid var(--led-ok);
  border-bottom:3px solid var(--led-ok);transform:rotate(-45deg) translate(2px,-3px);border-radius:1px}
.done{text-align:center}
.done h3{font-size:19px;font-weight:600;margin-bottom:6px}
.done p{font-size:13.5px;color:#6B7B8A;line-height:1.6}

.nav{display:flex;gap:8px;justify-content:center;margin-top:20px}
.nav button{font-family:inherit;font-size:11.5px;background:rgba(255,255,255,.06);color:#8A98A5;
  border:1px solid rgba(255,255,255,.1);padding:6px 12px;border-radius:20px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.12);color:#E8EDF2}
.nav button.on{background:#E8EDF2;color:var(--ink);border-color:#E8EDF2}

/* מצב כהה — הכרטיס מתחלף; הרקע כהה ממילא */
#theme{font-family:inherit;font-size:14px;width:34px;height:34px;border-radius:10px;
  background:rgba(255,255,255,.06);color:#8FA0B2;border:1px solid rgba(255,255,255,.1);
  cursor:pointer;margin-inline-start:10px}
#theme:hover{color:#E8EDF2}
body.dark{
  --surface:#18222E; --ink:#E8EDF2; --hair-l:#2A3846; --indigo-soft:#232F49;
}
body.dark .chead p,body.dark .mode small,body.dark .img small,body.dark .hint,
body.dark .img .sz,body.dark .glabel,body.dark label,body.dark .pstats,
body.dark .done p{color:#8FA0B2}
body.dark input{background:#0F1720;color:var(--ink);border-color:#2A3846}
body.dark .btn{background:#1A2531;color:#E8EDF2;border-color:#2A3846}
body.dark .btn:hover{background:#22303F;border-color:#3A4A5C}
body.dark .btn.primary{background:#E8EDF2;color:#15202B;border-color:#E8EDF2}
body.dark .btn.primary:hover{background:#fff}
body.dark .foot{background:#131C26}
body.dark .mode:hover,body.dark .img:hover{background:#1E2936}
body.dark .mode.on,body.dark .img.on{background:#1E2936;border-color:#E8EDF2}
body.dark .mode .icons i{background:#3A4A5C}
body.dark .mach{border-color:#2A3846;color:#8FA0B2}
body.dark .mach.on{border-color:#E8EDF2;background:#1E2936;color:#E8EDF2}
body.dark .steps i{background:#2A3846}
body.dark .steps i.on{background:#E8EDF2}
body.dark .bar{background:#2A3846}
body.dark .session{background:#232F49}
body.dark .session b{color:#AAB8F0}
body.dark .session small{color:#8FA0B2}
body.dark .done .icon{background:#1C2C25}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="brand">
    <div class="mark"></div>
    <div><h1>שחזור מערכת</h1><p>שרת אימג'ים — מכללה</p></div>
    <div class="host">
      <span class="mono">00:00:5E:1C:04:7A</span><br>
      <span class="mono">10.99.12.187</span>
    </div>
    <button id="theme" title="ערכת צבעים">☾</button>
  </div>

  <div class="card" id="card"></div>

  <div class="nav">
    <button onclick="go(0)" id="n0">סיסמה</button>
    <button onclick="go(1)" id="n1">סוג הפצה</button>
    <button onclick="go(2)" id="n2">בחירת כיתה</button>
    <button onclick="go(3)" id="n3">בחירת מחשבים</button>
    <button onclick="go(4)" id="n4">בחירת אימג'</button>
    <button onclick="go(5)" id="n5">מצטרף לסבב</button>
    <button onclick="go(6)" id="n6">בפעולה</button>
    <button onclick="go(7)" id="n7">סיום</button>
  </div>
</div>

<script>
const imgs = {
  "סייבר":[["Kali + Wireshark","קורס ניתוח תעבורה","48.2 GB"],["Windows Server — AD Lab","הרשאות ו‑GPO","61.7 GB"]],
  "רשתות":[["GNS3 + Packet Tracer","קורס נתבים","54.1 GB"]],
  "אופיס":[["Office 2024 — סטנדרט","האימג' הנפוץ ביותר","58.8 GB"],["Office + Adobe","כיתות עיצוב","77.3 GB"]]
};

const classes = [
  ["כיתה LAB1","חומרה · 30 מחשבים"],
  ["כיתה LAB2","תוכנה · 28 מחשבים"],
  ["כיתה 303","סייבר · 24 מחשבים"],
];

let MODE = "single";   // "single" / "class" — קובע את המסלול ואת שדה השם

const screens = [
// 0 — password
{h:"כניסה",p:"הזדהות לפני שחזור",s:0,n:5,b:`
  <label for="u">שם משתמש</label><input id="u" value="nadav" autocomplete="off">
  <div style="height:14px"></div>
  <label for="p">סיסמה</label><input id="p" type="password" value="••••••••">`,
 f:`<button class="btn primary" onclick="go(1)">המשך</button>
    <button class="btn ghost" onclick="go(6)">אתחול מהדיסק המקומי</button>`},

// 1 — mode
{h:"סוג ההפצה",p:"מה מותקן עכשיו",s:1,n:6,b:()=>`
  <div class="modes">
    <div class="mode ${MODE==="single"?"on":""}" onclick="pickMode(this,'single')">
      <div class="icons"><i class="lit"></i></div>
      <b>תחנה בודדת</b><small>שחזור למחשב הזה בלבד. מתחיל מיד.</small></div>
    <div class="mode ${MODE==="class"?"on":""}" onclick="pickMode(this,'class')">
      <div class="icons"><i class="lit"></i><i class="lit"></i><i class="lit"></i><i></i></div>
      <b>כיתה</b><small>סבב משותף. כל המחשבים מקבלים יחד בשידור אחד.</small></div>
  </div>`,
 f:`<button class="btn primary" onclick="go(MODE==='class'?2:4)">המשך</button>
    <button class="btn" onclick="go(0)">חזרה</button>`},

// 2 — class picker (class mode only)
{h:"בחירת כיתה",p:"לאיזו כיתה נפתח הסבב",s:2,n:6,b:`
  ${classes.map(([n,d],i)=>`<div class="img ${i===0?'on':''}" onclick="pickImg(this)">
    <div class="chip"></div><div><b>${n}</b><small>${d}</small></div></div>`).join("")}
  <p class="hint">הרשימה מגיעה מטבלאות ה-MAC בשרת. מספר המחשבים הצפוי נקבע
     מהטבלה — אין מה להקליד אותו.</p>`,
 f:`<button class="btn primary" onclick="go(3)">המשך</button>
    <button class="btn" onclick="go(1)">חזרה</button>`},

// 3 — machine picker (class mode only)
{h:"בחירת מחשבים",p:"למי ההפצה מיועדת — כיתה 303",s:3,n:6,b:`
  <div class="machgrid">
    ${Array.from({length:24},(_,i)=>String(i+1).padStart(2,"0")).concat(["INS"])
      .map(n=>`<div class="mach on" onclick="toggleMach(this)">${n}</div>`).join("")}
  </div>
  <p class="hint">כברירת מחדל כל הכיתה נבחרת — אפשר לבטל מחשבים בודדים.
     רק הנבחרים יוערו ב-WoL ויצטרפו לסבב; מחשב שלא נבחר ועולה ב-PXE
     ממשיך לדיסק המקומי כרגיל.</p>`,
 f:`<button class="btn primary" onclick="go(4)">המשך — <span id="mcount">25</span> מחשבים</button>
    <button class="btn" onclick="allMach()">כל הכיתה</button>
    <button class="btn" onclick="go(2)">חזרה</button>`},

// 4 — image + name (name field depends on the mode)
{h:"בחירת אימג'",p:"מה יותקן על התחנה",s:4,n:6,b:()=>`
  ${Object.entries(imgs).map(([g,list],gi)=>`
    <div class="group"><div class="glabel">${g}</div>
      ${list.map(([n,d,s],i)=>`<div class="img ${gi===0&&i===0?'on':''}" onclick="pickImg(this)">
        <div class="chip"></div><div><b>${n}</b><small>${d}</small></div>
        <span class="sz">${s}</span></div>`).join("")}
    </div>`).join("")}
  <div class="namewrap">${MODE==="class"?`
    <label for="nm">קידומת שמות לכיתה</label>
    <input id="nm" value="303" autocomplete="off">
    <p class="hint">מקלידים פעם אחת לכל הכיתה. כל מחשב יקבל את השם
       <span class="mono">&lrm;קידומת-סיומת</span> לפי טבלת ה-MAC:
       <span class="mono">303-01</span> … <span class="mono">303-27</span>,
       ומחשב המרצה תמיד <span class="mono">303-INS</span>.</p>`:`
    <label for="nm">שם המחשב</label>
    <input id="nm" value="LAB2-05" autocomplete="off">
    <p class="hint">השם ייכתב לתוך המערכת בסיום ההתקנה — אין צורך לשנות אותו ידנית אחר כך.</p>`}
  </div>`,
 f:`<button class="btn primary" onclick="go(6)">התחלה</button>
    <button class="btn" onclick="go(MODE==='class'?3:1)">חזרה</button>`},

// 5 — joining an open session
{h:"סבב פתוח בכיתה",p:"האימג' כבר נבחר — אין מה להקליד",s:4,n:6,b:`
  <div class="session"><div class="dot"></div>
    <div><b>Office 2024 — סטנדרט</b>
    <small>נפתח לפני 3 דקות · ‎11 מחשבים מחוברים · השידור מתחיל בעוד 2:14</small></div></div>
  <label for="nm2">שם המחשב</label>
  <input id="nm2" value="LAB2-12" autocomplete="off">
  <p class="hint">המחשב יצטרף לשידור המשותף. אין צורך בסיסמה או בבחירת אימג' — הם נקבעו במחשב הראשון. השם נגזר מטבלת ה-MAC.</p>`,
 f:`<button class="btn primary" onclick="go(6)">הצטרפות לסבב</button>
    <button class="btn" onclick="go(1)">סבב חדש במקום</button>`},

// 6 — writing
{h:"בכתיבה",p:"אין לכבות את המחשב",s:5,n:6,b:`
  <div class="prog"><div class="pct">38%</div><div class="lbl">Office 2024 — סטנדרט</div></div>
  <div class="bar"><i></i></div>
  <div class="pstats">
    <span>נכתבו <b>22.4 GB</b> מתוך <b>58.8 GB</b></span>
    <span>נותרו כ‑<b>4:20</b></span></div>
  <div class="peers"><div class="glabel">מחשבים בסבב</div>
    ${[["LAB2-INS","done","הושלם"],["LAB2-01","done","הושלם"],["LAB2-05","","38%"],
       ["LAB2-12","","38%"],["LAB2-18","","36%"]].map(([n,c,s])=>
      `<div class="peer"><span class="led ${c}"></span><span class="pc">${n}</span>
       <span class="st">${s}</span></div>`).join("")}
    <div class="peer" style="color:#8A98A5"><span style="width:7px"></span>
      <span style="font-size:12.5px">ועוד 6 מחשבים</span></div></div>`,
 f:`<button class="btn ghost" style="margin:0">ביטול הסבב</button>`},

// 7 — done
{h:"",p:"",s:6,n:6,b:`
  <div class="done"><div class="icon"></div>
    <h3>ההתקנה הושלמה</h3>
    <p>המחשב <span class="mono" style="font-weight:600">LAB2-05</span> מוכן.<br>
       השם נכתב למערכת. אפשר לאתחל.</p></div>`,
 f:`<button class="btn primary" onclick="go(0)">אתחול</button>
    <button class="btn">כיבוי</button>`}
];

function draw(i){
  const s=screens[i];
  document.getElementById("card").innerHTML=`
    ${s.h?`<div class="chead"><h2>${s.h}</h2><p>${s.p}</p></div>`:""}
    <div class="steps">${Array.from({length:s.n},(_,k)=>`<i class="${k<s.s?'on':''}"></i>`).join("")}</div>
    <div class="body">${typeof s.b==="function"?s.b():s.b}</div>
    <div class="foot">${s.f}</div>`;
  document.querySelectorAll(".nav button").forEach((b,k)=>b.classList.toggle("on",k===i));
}
function go(i){draw(i)}
function pickMode(el,mode){
  MODE=mode;
  document.querySelectorAll(".mode").forEach(m=>m.classList.remove("on"));
  el.classList.add("on");
}
function pickImg(el){
  document.querySelectorAll(".img").forEach(m=>m.classList.remove("on"));
  el.classList.add("on");
}
/* אותו זיכרון ערכת צבעים כמו הקונסולה והקיוסק. */
function setTheme(dark){
  document.body.classList.toggle("dark",dark);
  document.getElementById("theme").textContent=dark?"☀":"☾";
  localStorage.setItem("imagectl-theme",dark?"dark":"light");
}
document.getElementById("theme").onclick=
  ()=>setTheme(!document.body.classList.contains("dark"));
if(localStorage.getItem("imagectl-theme")==="dark")setTheme(true);
function machCount(){
  const c=document.querySelectorAll(".mach.on").length;
  const el=document.getElementById("mcount");
  if(el)el.textContent=c;
}
function toggleMach(el){el.classList.toggle("on");machCount()}
function allMach(){
